[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reasonrender-rrc"
version = "0.1.0"
description = "ReasonRender for Code v2 pipeline and evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["rrc"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not paid_live"]
minversion = "8.3"
testpaths = ["tests"]
markers = [
    "installed_fake_provider: exercises installed Codex against a loopback-only fake model provider",
    "paid_live: explicitly permitted paid live-provider test excluded from default collection",
    "sandbox_real: exercises the sealed task-local Docker verifier backend",
]

[tool.ruff]
exclude = [
    ".agent-workspace",
    ".generated",
    "EverOS",
    "TokenTracker",
    "opencode",
]
line-length = 100
src = ["rrc", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pyright]
exclude = [
    ".agent-workspace",
    ".generated",
    "EverOS",
    "TokenTracker",
    "opencode",
]
include = ["rrc", "tests"]
pythonPlatform = "All"
pythonVersion = "3.11"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
